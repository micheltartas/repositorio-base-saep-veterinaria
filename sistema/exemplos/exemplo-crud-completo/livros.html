<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container mt-4">
        <h1 class="h3 mb-4">Exemplo: Biblioteca (livros)</h1>

        <div class="row mb-3">
            <div class="col-12 col-md-6">
                <div class="input-group">
                    <input type="text" id="input-busca" class="form-control" placeholder="Buscar por título...">
                    <button id="btn-buscar" class="btn btn-outline-secondary">Buscar</button>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h2 class="h5 mb-3">Novo / Editar Livro</h2>
                <form id="form-livro">
                    <input type="hidden" id="livro-id">
                    <div class="row g-2">
                        <div class="col-12 col-md-4">
                            <label class="form-label">Título</label>
                            <input type="text" id="livro-titulo" class="form-control" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label">Autor</label>
                            <input type="text" id="livro-autor" class="form-control">
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label">Categoria</label>
                            <select id="livro-categoria" class="form-select" required>
                                <option value="">Carregando...</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">Salvar</button>
                        <button type="button" id="btn-cancelar" class="btn btn-secondary d-none">Cancelar edição</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table table-hover">
            <thead>
                <tr><th>Título</th><th>Autor</th><th>Categoria</th><th>Ações</th></tr>
            </thead>
            <tbody id="corpo-tabela"></tbody>
        </table>
    </main>

    <script src="livros.js"></script>
</body>
</html>
