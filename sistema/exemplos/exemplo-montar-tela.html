<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo - Montar a tela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!--
        EXEMPLO DE REFERÊNCIA (cenário fictício: livros).
        Este HTML existe para vocês verem de onde vêm os ids usados
        no exemplo-montar-tela.js: cada document.getElementById('x')
        procura um elemento com id="x" aqui.
        Os ids dos campos do sistema de vocês estão nos .html da
        pasta public/ - sempre confiram lá o nome exato.
    -->
    <main class="container mt-4">
        <h1 class="h3 mb-4">Exemplo: Livros</h1>

        <!-- BUSCA -->
        <div class="row mb-3">
            <div class="col-12 col-md-6">
                <div class="input-group">
                    <input type="text" id="input-busca" class="form-control" placeholder="Buscar por título...">
                    <button id="btn-buscar" class="btn btn-outline-secondary">Buscar</button>
                </div>
            </div>
        </div>

        <!-- FORMULÁRIO (serve para cadastrar e para editar) -->
        <div class="card mb-4">
            <div class="card-body">
                <form id="form-livro">
                    <!-- campo escondido: guarda o id quando o usuário clica em "Editar" -->
                    <input type="hidden" id="livro-id">

                    <div class="row g-2">
                        <div class="col-12 col-md-3">
                            <label for="livro-titulo" class="form-label">Título</label>
                            <input type="text" id="livro-titulo" class="form-control" required>
                        </div>
                        <div class="col-12 col-md-3">
                            <label for="livro-autor" class="form-label">Autor</label>
                            <input type="text" id="livro-autor" class="form-control">
                        </div>
                        <div class="col-12 col-md-3">
                            <label for="livro-categoria" class="form-label">Categoria</label>
                            <!-- as <option> são criadas pelo JavaScript -->
                            <select id="livro-categoria" class="form-select" required>
                                <option value="">Carregando...</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-3">
                            <label for="livro-publicacao" class="form-label">Publicação</label>
                            <input type="date" id="livro-publicacao" class="form-control">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary mt-3">Salvar</button>
                </form>
            </div>
        </div>

        <!-- MENSAGEM (aparece quando não há registros ou deu erro) -->
        <div id="mensagem-livros" class="text-muted">Carregando livros...</div>

        <!-- TABELA (começa escondida: d-none = display none do Bootstrap) -->
        <table class="table table-hover d-none" id="tabela-livros">
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Categoria</th>
                    <th>Publicação</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <!-- o JavaScript preenche as linhas aqui dentro -->
            <tbody id="corpo-tabela-livros"></tbody>
        </table>
    </main>

    <script src="exemplo-montar-tela.js"></script>
</body>
</html>
