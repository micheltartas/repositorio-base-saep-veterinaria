<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Veterinária - Pets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a href="principal.html" class="navbar-brand text-decoration-none">🐾 Clínica Veterinária</a>
            <a href="principal.html" class="btn btn-outline-light btn-sm">← Início</a>
        </div>
    </nav>

    <main class="container">
        <h1 class="h3 mb-4">Pets</h1>

        <!-- Cadastro de pet (RF-18) -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h5 mb-3">Novo Pet</h2>
                <form id="form-pet">
                    <div class="row g-2">
                        <div class="col-12 col-md-4">
                            <label for="pet-nome" class="form-label">Nome do pet</label>
                            <input type="text" id="pet-nome" class="form-control" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="pet-especie" class="form-label">Espécie</label>
                            <input type="text" id="pet-especie" class="form-control" placeholder="Ex: Cachorro, Gato...">
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="pet-tutor" class="form-label">Tutor</label>
                            <select id="pet-tutor" class="form-select" required>
                                <option value="">Carregando tutores...</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                    </div>
                </form>
                <div id="mensagem-pet" class="mt-3"></div>
            </div>
        </div>
    </main>

    <script src="js/pets.js"></script>
</body>
</html>
