<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Veterinária - Agendamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a href="principal.html" class="navbar-brand text-decoration-none">🐾 Clínica Veterinária</a>
            <a href="principal.html" class="btn btn-outline-light btn-sm">← Início</a>
        </div>
    </nav>

    <main class="container">
        <h1 class="h3 mb-4">Agendamentos</h1>

        <!-- Listagem (RF-19) -->
        <div id="mensagem-agendamentos" class="text-muted">Carregando agendamentos...</div>
        <table class="table table-hover d-none" id="tabela-agendamentos">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Pet</th>
                    <th>Espécie</th>
                    <th>Tutor</th>
                    <th>Telefone do tutor</th>
                    <th>Observação</th>
                    <th class="tabela-acoes">Ações</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela-agendamentos">
                <!-- linhas geradas via JS -->
            </tbody>
        </table>
    </main>

    <script src="js/agendamentos.js"></script>
</body>
</html>
